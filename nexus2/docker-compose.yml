services:
  nexus:
    image: sonatype/nexus:2.15.2-03
    container_name: nexus2
    restart: unless-stopped

    ports:
      - "8081:8081"

    volumes:
      - nexus-data:/sonatype-work

    environment:
      MIN_HEAP: 512m
      MAX_HEAP: 1024m
      JAVA_OPTS: >-
        -server
        -Djava.net.preferIPv4Stack=true

volumes:
  nexus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/god/ci/nexus2/nexus-data
